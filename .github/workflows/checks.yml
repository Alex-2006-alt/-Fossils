name: Application checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    env:
      DATABASE_URL: file:/tmp/famvault-ci.db
      PRIVATE_UPLOAD_DIR: /tmp/famvault-ci-media
      APP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      AUTH_SECRET: ci-only-non-production-secret-at-least-32-characters
      NEXTAUTH_SECRET: ci-only-non-production-secret-at-least-32-characters
      STORAGE_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:prepare
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
      - run: npm audit --audit-level=high

