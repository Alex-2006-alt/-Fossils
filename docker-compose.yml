# FamVault — Local Development Infrastructure
# Usage: docker compose up -d

services:
  # ── PostgreSQL 16 + pgvector ──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: famvault-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: famvault
      POSTGRES_USER: famvault
      POSTGRES_PASSWORD: famvault_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U famvault"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 (BullMQ queue store) ──
  redis:
    image: redis:7-alpine
    container_name: famvault-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (optional, dev only) ──
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: famvault-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@famvault.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
