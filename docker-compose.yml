# Optional infrastructure for a PostgreSQL migration rehearsal.
# The application currently runs with SQLite and a durable database job queue.
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    profiles: ["migration"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: famvault
      POSTGRES_USER: famvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the migration database}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U famvault"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:

